name: ci
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m payguard.ingest
      - run: pytest -q
      # LLMOps quality gate: fails the build if eval metrics regress below thresholds
      - run: PYTHONPATH=src python -m payguard.evals --gate
      - run: docker build -t payguard-ai .
